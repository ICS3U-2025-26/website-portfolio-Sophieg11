<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width", initial-scale="1">
        <title> About Me Page</title>
        <style>
            .sidenav {
      height:100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      overflow-x: hidden;
      padding-top: 60px;
      transition: 0.5s;
      background-color:pink;
    }

    .sidenav a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: #e75480;
      display: block;
      transition: 0.3s;
    }

    .sidenav a:hover {
      color: #ca446c
    }

    .sidenav .closebtn {
      position: absolute;
      top: 0;
      right: 20px;
      font-size: 36px;
      margin-left: 50px;
    }

    span{

      font-size: 30px;
      color:#e75480;
    }
     .submenu-container {
    display: block;
  }

  /* Make the toggle look like other links */
  .submenu-toggle {
    display: block;
    padding: 8px 8px 8px 32px;
    text-decoration: none;
    font-size: 25px;
    color: #e75480;
    cursor: pointer;
  }

  .submenu-toggle:hover { color: #ca446c; }

  /* pseudo arrow: will replace the manual arrow character */
  .submenu-toggle::after {
    content: "▸";
    float: right;
    transition: transform 0.2s;
  }

  /* submenu hidden by default */
  .sidenav .submenu {
    display: none;
    list-style: none;
    padding-left: 50px;
    margin: 0;
  }

  .sidenav .submenu li a {
    font-size: 20px;
    padding: 6px 8px;
    color: #e75480;
  }

  /* When container has .active show submenu and rotate arrow */
  .submenu-container.active .submenu {
    display: block;
  }

  .submenu-container.active .submenu-toggle::after {
    transform: rotate(90deg);
  }

        </style>
    </head>
    <body>

        <script>
            function openNav() {
      document.getElementById("mySidenav").style.width = "250px";
    }

    function closeNav() {
      document.getElementById("mySidenav").style.width = "0"
    }
    document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".submenu-toggle").forEach(toggle => {
      toggle.addEventListener("click", (e) => {
        e.preventDefault();           // don't navigate
        const container = toggle.parentElement; // .submenu-container
        container.classList.toggle("active");
      });
    });
  });
        </script>
         <div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <div class="submenu-container">
    <a href="projects.html" class="submenu-toggle"> My Projects</a>
    <ul class="submenu">
      <li><a href="unit1.html"> Unit 1</a></li>
      <li><a href="unit2.html"> Unit 2</a></li>
      <li><a href="unit3.html"> Unit 3</a></li>
      <li><a href="unit4.html"> Unit 4</a></li>
    </ul>
    </div>
    <a href="resources.html"> Resources</a>
    <a href="gaming.html"> Gaming Corner</a>
  </div>

  <span onclick="openNav()">☰ Menu</span>



    </body>
</html>
