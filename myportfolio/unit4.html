<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width", initial-scale="1">
        <title>Unit 4</title>
        <style>
            .sidenav {
      height:100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      overflow-x: hidden;
      padding-top: 60px;
      transition: 0.5s;
      background-color:pink;
    }

    .sidenav a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: #e75480;
      display: block;
      transition: 0.3s;
    }

    .sidenav a:hover {
      color: #ca446c
    }

    .sidenav .closebtn {
      position: absolute;
      top: 0;
      right: 20px;
      font-size: 36px;
      margin-left: 50px;
    }

    span{
      font-size: 30px;
      color:#e75480;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
     /* Submenu container */
.submenu-container {
  padding-left: 32px;
}

/* Header row (link + arrow) */
.submenu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* My Projects main link */
.submenu-main {
  font-size: 25px;
  color: #e75480;
  text-decoration: none;
  flex: 1;
  padding: 8px 0;
}

/* Arrow button */
.submenu-toggle {
  background: none;
  border: none;
  color: #e75480;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
  flex-shrink: 0;
}

.submenu-toggle::before {
  content: "▸";
  display: inline-block;
  transition: transform 0.2s ease;
}

.submenu-container.active .submenu-toggle::before {
  transform: rotate(90deg);
}

/* Submenu links */
.submenu {
  display: none;
  list-style: none;
  padding-left: 20px;
  margin: 0;
}

.submenu-container.active .submenu {
  display: block;
}

        </style>
    </head>
    <body>

        <script>
            function openNav() {
      document.getElementById("mySidenav").style.width = "250px";
    }

    function closeNav() {
      document.getElementById("mySidenav").style.width = "0"
    }
   // Toggle submenu when arrow is clicked
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".submenu-toggle").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation(); // don’t trigger parent link
      const container = btn.closest(".submenu-container");
      container.classList.toggle("active");
    });
  });
});
        </script>
