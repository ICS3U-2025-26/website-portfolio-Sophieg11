<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Reveal Hero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, sans-serif; }

    /* Full-screen hero */
    .hero {
      position: relative;
      height: 100vh;
      background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Text box */
    .text-box {
      background: white);
      padding: 5rem 6rem;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .text-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero h1 { font-size: 3rem; letter-spacing: 2px; color: #fff; }
    .hero h2 { font-size: 1.5rem; color: #ddd; margin-top: 0.5rem; }
    .hero p { font-size: 1rem; color: #ccc; margin-top: 0.5rem; }

    /* Content below hero */
    .content {
      height: 150vh;
      background-color: #111;
      color: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="text-box" id="textBox">
      <h1>Sophie Goldman</h1>
      <h2>Computer Science Portfolio</h2>
      <p>2025–2026</p>
    </div>
  </section>

  <section class="content">
    Scroll to see the cinematic effect.
  </section>

  <script>
    const textBox = document.getElementById("textBox");
    const hero = document.querySelector(".hero");
    const heroHeight = hero.offsetHeight;

    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;

      // Fade in when user scrolls ~10% into hero
      if(scrollY > heroHeight * 0.1 && scrollY < heroHeight * 0.7){
        textBox.classList.add("visible");
      } else {
        textBox.classList.remove("visible");
      }
    });
  </script>

</body>
</html>
